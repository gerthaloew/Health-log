try{const total=(p.total||0)+c,start=p.start||fv('rd'),r=await sb.from('pt_packages').upsert({member_id:id,trainer_id:me.id,total,mem_start:start,mem_end:end,updated_at:new Date().toISOString()});if(r.error)throw r.error;
const h=await sb.from('pt_payments').insert({member_id:id,trainer_id:me.id,paid_at:fv('rd'),pt_count:c,mem_start:start,mem_end:end,note:fv('rn')||null});if(h.error)toast('이력 기록에 실패했어요: '+h.error.message);
closeS();await loadPT();renderDash();toast('재등록을 저장했어요 (총 '+total+'회)')}catch(err){toast(saveErr(err))}finally{busy=false}}
else if(a==='regsave'){if(busy)return;const tv=fv('pt'),t=tv===''?null:parseInt(tv);if(t!=null&&(isNaN(t)||t<0))return toast('횟수를 숫자로 입력해 주세요');if(fv('ms')&&fv('me')&&fv('me')<fv('ms'))return toast('종료일이 시작일보다 빨라요');busy=true;try{const r=await sb.from('pt_packages').upsert({member_id:b.dataset.i||fv('rm'),trainer_id:me.id,total:t,mem_start:fv('ms')||null,mem_end:fv('me')||null,updated_at:new Date().toISOString()});if(r.error)throw r.error;closeS();await loadPT();renderDash();toast('저장했어요')}catch(err){toast(saveErr(err))}finally{busy=false}}

/* ===== 수면 기록 ===== */
S.sleep=S.sleep||[];
const hm=iso=>{if(!iso)return'';const q=sp(iso);return pad(q.h)+':'+pad(q.m)};
const mapSl=r=>({id:r.id,d:r.log_date,m:+r.minutes,a:hm(r.sleep_start),b:hm(r.sleep_end),src:r.source||'manual'});
async function loadSleep(){try{const r=await fetchAll('sleep_logs',viewAs?viewAs.id:me.id);S.sleep=r.error?[]:(r.data||[]).map(mapSl)}catch(e){S.sleep=[]}}
const slFmt=m=>Math.floor(m/60)+'시간'+(m%60?' '+m%60+'분':'');
const slOf=d=>(S.sleep||[]).find(x=>x.d===d);
function slAvg(){const a=(S.sleep||[]).filter(x=>x.d<=baseDay()&&x.d>addDays(baseDay(),-7));return a.length?Math.round(a.reduce((t,x)=>t+x.m,0)/a.length):null}
function slCan(){return !isRO()}
function sleepToday(){const r=slOf(day),av=slAvg();return`<section class="card wsq"><h3>수면${slCan()?`<button class="cp" data-a="sleepset" data-d="${day}">${r?'수정':'+ 기록'}</button>`:''}</h3>${r?`<div class="big">${slFmt(r.m)}</div>${r.a&&r.b?`<div class="mut">${r.a} ~ ${r.b}</div>`:''}`:'<p class="empty">기록 없음</p>'}${av!=null?`<div class="mut">7일 평균 ${slFmt(av)}</div>`:''}</section>`}
const sleepRow=x=>`<div class="row ${slCan()?'tap':''}" ${slCan()?`role="button" tabindex="0" data-a="sview" data-d="${x.d}"`:''}><span class="n">${md(x.d)}${x.a&&x.b?`<small>${x.a} ~ ${x.b}</small>`:''}<small><span style="display:inline-block;height:6px;border-radius:3px;background:var(--pt);width:${Math.min(x.m/600*100,100)}%;min-width:4px"></span></small></span><b>${slFmt(x.m)}</b></div>`;
function sleepBody(){const all=[...(S.sleep||[])].sort((x,y)=>x.d<y.d?1:-1),av=slAvg();return`<section class="card"><h3>수면${slCan()?`<button class="cp" data-a="sleepset" data-d="${baseDay()}">+ 기록</button>`:''}</h3>${av!=null?`<div class="mut" style="margin:-4px 0 8px">최근 7일 평균 ${slFmt(av)}</div>`:''}${all.slice(0,2).map(sleepRow).join('')||'<p class="empty">수면 시간을 기록해 보세요.</p>'}${moreBtn('sleep',all.length)}</section>`}
/* 더보기 팝업: 기본 최근 7일, 30일·90일·전체로 바꿔 볼 수 있어요 */
var hK='body',hR='7';
function histHTML(){const n=hR==='all'?9999:+hR,from=addDays(baseDay(),-(n-1)),isB=hK==='body',
src=(isB?S.body:(S.sleep||[])).filter(x=>x.d>=from&&x.d<=baseDay()).sort((x,y)=>x.d<y.d?1:-1);
let st='';if(src.length){if(isB){const w=src.filter(x=>x.w);if(w.length){const av=Math.round(w.reduce((t,x)=>t+x.w,0)/w.length*10)/10,ch=Math.round((w[0].w-w[w.length-1].w)*10)/10;st=`<div class="calc"><div class="mut">${src.length}건 · 평균 체중 <b style="font-size:18px">${av}</b> kg${w.length>1?' · 변화 '+(ch>0?'+':'')+ch+' kg':''}</div></div>`}}else st=`<div class="calc"><div class="mut">${src.length}일 · 평균 수면 <b style="font-size:18px">${slFmt(Math.round(src.reduce((t,x)=>t+x.m,0)/src.length))}</b></div></div>`}
return`<h2>${isB?'체중·인바디 기록':'수면 기록'}</h2><div class="chips" style="margin:0 0 10px">${[['7','7일'],['30','30일'],['90','90일'],['all','전체']].map(([v,l])=>`<button type="button" class="chip${hR===v?' on':''}" data-a="hrng" data-v="${v}">${l}</button>`).join('')}</div>${st}${src.map(isB?bodyRow:sleepRow).join('')||'<p class="empty">이 기간에는 기록이 없어요. 기간을 늘려 보세요.</p>'}${btnRow('')}`}
function todaySleep(h){const k=h.indexOf('<section class="card hero"');if(k<0)return h+sleepToday();const e=h.indexOf('</section>',k)+10,a=h.indexOf('<section class="card tap wsq"'),z=a<0?-1:h.indexOf('</section>',a)+10,w=a<0?'':h.slice(a,z);if(a>=0)h=h.slice(0,a)+h.slice(z);return h.slice(0,e)+'<div class="two wsqs">'+sleepToday()+w+'</div>'+h.slice(e)};
function bodySleep(h){const m=h.indexOf('<h3>생리주기추적</h3>'),k=m>0?h.lastIndexOf('<section',m):-1;return k>0?h.slice(0,k)+sleepBody()+h.slice(k):h+sleepBody()};
document.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
if(a==='hist'){hK=b.dataset.k;hR='7';$('#sp').innerHTML=histHTML();$('#sh').hidden=false}
if(a==='hrng'){hR=b.dataset.v;$('#sp').innerHTML=histHTML()}
if(a==='sleepset'){if(!slCan())return toast('이 회원은 열람만 동의했어요');const d=b.dataset.d||day,r=slOf(d);$('#sp').innerHTML=`<h2>수면 기록</h2><label>일어난 날<input id="f_sd" type="date" value="${d}"></label><div class="g3" style="grid-template-columns:1fr 1fr"><label>잠든 시각<input id="f_sa" type="time" value="${r&&r.a?r.a:'23:00'}"></label><label>일어난 시각<input id="f_sb" type="time" value="${r&&r.b?r.b:'07:00'}"></label></div><div class="mut" id="slsum" style="margin:6px 0 10px"></div><button class="save" data-a="sleepsave">저장</button>${r?'<button class="save" data-a="sleepdel" data-i="'+r.id+'" style="background:none;color:var(--fat);margin-top:0">삭제</button>':''}`;$('#sh').hidden=false}
if(a==='sleepsave'){if(busy)return;const dd=fv('sd'),A=fv('sa'),B=fv('sb');if(!dd||!A||!B)return toast('날짜와 잠든·일어난 시각을 입력해 주세요');const sl=slCalc(dd,A,B);if(sl.min<=0||sl.min>1440)return toast('수면 시간을 확인해 주세요');busy=true;
try{const r=await sb.from('sleep_logs').upsert({user_id:OID(),log_date:dd,minutes:sl.min,sleep_start:sl.st,sleep_end:sl.en,source:'manual'},{onConflict:'user_id,log_date'}).select().single();if(r.error)throw r.error;S.sleep=[...(S.sleep||[]).filter(x=>x.d!==dd),{id:(r.data&&r.data.id)||dd,d:dd,m:sl.min,a:A,b:B,src:'manual'}];closeS();render();toast('저장했어요')}catch(err){toast(saveErr(err))}finally{busy=false}}
if(a==='sleepdel'){if(busy)return;busy=true;try{const r=await sb.from('sleep_logs').delete().eq('id',b.dataset.i);if(r.error)throw r.error;S.sleep=(S.sleep||[]).filter(x=>String(x.id)!==b.dataset.i);closeS();render();toast('삭제했어요')}catch(err){toast('삭제하지 못했어요')}finally{busy=false}}
});

<script type="text/app">
/* ===== 개인정보 제공 동의 (가입·트레이너 연결과 함께) ===== */
function consentSheet(){$('#sp').innerHTML=`<h2>개인정보 제공 동의</h2><p>담당 트레이너와 관리자가 내 모든 개인정보(식사, 운동, 체중·인바디, 수면, 생리주기, 수업 일정 포함)를 보고, 필요하면 대신 입력·수정할 수 있어요.</p><p class="mut">이 앱은 트레이너와 연결해서 쓰는 서비스라서, 연결을 유지하려면 동의가 필요해요. 동의하지 않으면 트레이너가 기록을 볼 수 없어요.</p><button class="save" data-a="agreeall">동의하고 계속</button><button class="save" data-a="logout" style="background:none;color:var(--mut);margin-top:0">로그아웃</button>`;$('#sh').hidden=false}

return`<div class="tp"><select data-tp="${id}" aria-label="시">${Array.from({length:24},(_,i)=>`<option value="${pad(i)}"${i===h?' selected':''}>${i}시</option>`).join('')}</select><select data-tp="${id}" aria-label="분">${Array.from({length:12},(_,i)=>`<option value="${pad(i*5)}"${i*5===mm?' selected':''}>${pad(i*5)}분</option>`).join('')}</select><input type="hidden" id="f_${id}" value="${pad(h)}:${pad(mm)}"></div>`}

function lessonView(id){const l=(S.lessons||[]).find(y=>String(y.id)===String(id));if(!l)return;viewSheet('수업 일정',[['날짜',md(l.d)],['시간',pad(l.h)+'시 '+pad(l.m)+'분'],['종류',lDot(l)+l.kind],['회차',l.no?l.no+'회차':''],['상태',SR[l.status]||'예정'],['등록',l.tid?'트레이너 등록':'직접 등록'],['메모',l.memo?esc(l.memo):'']],canEd(l)?`data-a="ledit" data-i="${l.id}"`:'')}

document.addEventListener('change',e=>{if(e.target.id==='f_cm'&&$('#ckw'))$('#ckw').innerHTML=ckChips(e.target.value)});
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,d=b.dataset;if(a==='bview')bodyView(d.i);else if(a==='sview')sleepView(d.d);else if(a==='lview')lessonView(d.i);else if(a==='cview')cycView(d.s)});
const SAVEA=new Set(['save','upd','uwork','ubody','ucyc','ulesson','sleepsave','ptsave','regsave','rsave','nsave','olsave','csave','msave','saveg2']);
function addClose(){const sp=$('#sp');if(!sp)return;sp.querySelectorAll('button.save').forEach(b=>{if(b.dataset.cl||!SAVEA.has(b.dataset.a))return;b.dataset.cl='1';const w=document.createElement('div');w.className='sbrow';b.replaceWith(w);w.appendChild(b);const c=document.createElement('button');c.type='button';c.className='save cls';c.dataset.a='shut';c.dataset.cl='1';c.textContent='닫기';w.appendChild(c)})}
{const sp=$('#sp');if(sp)new MutationObserver(addClose).observe(sp,{childList:true,subtree:true})}

function acctHealth(){const el=$('#sp').querySelector('[data-a="saveg"]');if(el&&!viewAs)el.insertAdjacentHTML('afterend','<button class="save" data-a="hsync" style="margin-top:12px;background:var(--pt);color:var(--pine)">애플 건강 연동 (단축어)</button>')};
function hsSheet(tok,msg){$('#sp').innerHTML=`<h2>애플 건강 연동</h2><p class="mut" style="font-size:13px">아이폰 단축어가 체중·수면을 이 앱으로 보내요. 아래 두 값을 단축어에 붙여넣어요.</p><label>주소</label><input readonly id="hs_u" value="${esc(HS_URL)}"><button class="cp" data-a="hscopy" data-t="hs_u" style="margin:6px 0 10px">주소 복사</button><label>내 토큰 (비밀번호처럼 다른 사람에게 알려주지 마세요)</label><input readonly id="hs_t" value="${esc(tok)}"><button class="cp" data-a="hscopy" data-t="hs_t" style="margin:6px 0 10px">토큰 복사</button>${msg?'<p class="mut">'+msg+'</p>':''}<button class="save" data-a="hsrot" style="background:none;color:var(--fat)">토큰 다시 만들기</button><button class="save" data-a="shut" style="background:none;color:var(--mut);margin-top:0">닫기</button>`;$('#sh').hidden=false}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-a=hsync],[data-a=hsrot],[data-a=hscopy]');if(!b)return;const a=b.dataset.a;
if(a==='hscopy'){const v=($('#'+b.dataset.t)||{}).value||'';try{await navigator.clipboard.writeText(v);toast('복사했어요')}catch(_){const i=$('#'+b.dataset.t);i&&(i.select(),toast('길게 눌러 복사해 주세요'))}return}
if(busy)return;busy=true;try{
if(a==='hsrot'&&!confirm('토큰을 다시 만들면 기존 단축어는 새 토큰으로 바꿔야 해요. 계속할까요?'))return;
const r=await sb.rpc(a==='hsrot'?'rotate_health_token':'get_health_token');if(r.error)throw r.error;hsSheet(r.data,a==='hsrot'?'새 토큰을 만들었어요. 단축어의 토큰도 바꿔 주세요.':'')}catch(err){toast('불러오지 못했어요: '+(err.message||''))}finally{busy=false}});

document.addEventListener('keydown',e=>{if(e.key!=='Enter'||e.isComposing)return;const t=e.target;if(!t||!['a_e','a_p','a_n'].includes(t.id))return;e.preventDefault();const x=$('#a_x'),b=document.querySelector('#auth [data-a='+(x&&!x.hidden?'signup':'login')+']');if(b)b.click()});
</script>
<script type="text/app">
/* ===== 하단 안내(이용약관·개인정보처리방침), 문의·버그 신고, 관리자 문의함 ===== */
function footHTML(){return`<div class="foot"><div class="fl"><button type="button" data-a="ft_terms">이용약관</button><i>|</i><button type="button" data-a="ft_priv">개인정보처리방침</button><i>|</i><button type="button" data-a="ft_inq">문의·버그 신고</button></div><p>개인이 운영하는 서비스예요 · 문의 ${esc(SUPPORT_EMAIL)}</p></div>`}
const TOS_HTML=()=>`<div class="mut tos" style="font-size:13px;line-height:1.65"><b>1. 목적</b>이 약관은 개인이 운영하는 건강 기록 서비스(이하 "서비스")의 이용 조건을 정해요.<b>2. 서비스 내용</b>식사, 운동, 체중·체성분, 수면, 생리주기, 수업 일정을 기록하고, 담당 트레이너와 관리자가 회원 관리를 위해 이를 열람·입력·수정할 수 있어요. 서비스는 현재 무료로 제공돼요.<b>3. 계정</b>가입할 때 입력한 정보는 정확해야 하고, 계정과 비밀번호는 본인이 관리해야 해요. 다른 사람에게 계정을 빌려주면 안 돼요.<b>4. 이용자가 지켜야 할 점</b>다른 사람의 정보를 허락 없이 입력하거나, 서비스를 방해하는 행위(비정상적인 접속, 자동 입력 등)를 하면 이용이 제한될 수 있어요.<b>5. 의료 정보가 아니에요</b>서비스의 기록, 계산된 열량, 그래프는 참고용이에요. 의학적 진단이나 치료를 대신하지 않아요. 건강에 이상이 있으면 의료진과 상담해 주세요.<b>6. 서비스 변경과 중단</b>운영자는 서비스의 일부 또는 전부를 변경하거나 중단할 수 있어요. 중요한 변경은 앱 안에서 미리 알릴게요.<b>7. 책임의 제한</b>개인이 운영하는 서비스라서, 천재지변이나 외부 서비스(Supabase, GitHub 등) 장애로 생긴 기록 손실이나 접속 장애에 대한 책임이 제한될 수 있어요. 중요한 기록은 따로 보관해 주세요.<b>8. 탈퇴</b>설정 화면에서 언제든 회원 탈퇴를 할 수 있고, 탈퇴하면 모든 기록과 사진이 삭제돼요.<b>9. 문의</b>${esc(SUPPORT_EMAIL)} 또는 앱 안의 문의·버그 신고를 이용해 주세요.<p style="margin-top:10px">시행일: 2026년 11월 16일</p></div>`;
function pageSheet(title,body){$('#sp').innerHTML=`<h2>${title}</h2>${body}<button class="save" data-a="shut" style="background:none;color:var(--mut);margin-top:12px">닫기</button>`;$('#sh').hidden=false}
function inqSheet(){
if(!me||!me.id){return pageSheet('문의·버그 신고',`<p>로그인하면 앱 안에서 바로 보낼 수 있어요. 로그인 전이라면 아래 이메일로 보내 주세요.</p><p><b>${esc(SUPPORT_EMAIL)}</b></p>`)}
if(me.p&&me.p.is_demo){return toast('샘플 계정은 문의를 보낼 수 없어요')}
$('#sp').innerHTML=`<h2>문의·버그 신고</h2><label>종류</label>${chips('iq',['문의','버그 신고','건의'],['문의'])}<label>내용<textarea id="f_iq" rows="5" maxlength="2000" placeholder="어떤 상황인지 적어 주세요. 버그라면 어떤 화면에서 무엇을 눌렀는지 알려 주시면 좋아요."></textarea></label><p class="mut" style="font-size:12px;margin:4px 0 0">보낸 사람 이름, 기기 정보, 현재 화면이 함께 전달돼요.</p><button class="save" data-a="inqsave">보내기</button>`;$('#sh').hidden=false}
SAVEA.add('inqsave');
function acctFoot(){const sp=$('#sp');if(sp)sp.insertAdjacentHTML('beforeend',footHTML())};
/* 관리자·트레이너 문의함 */
let INQN=0;
function renderDash(){_renderDashBase();const s=document.querySelector('.dtop span');if(s&&me.p.role==='admin'){const o=s.querySelector('[data-a=bkup]');if(o)o.remove();s.insertAdjacentHTML('afterbegin',bkBtn())}if(s&&!s.querySelector('[data-a=inqbox]'))s.insertAdjacentHTML('afterbegin',`<button class="cp" data-a="inqbox">문의함${INQN?' ('+INQN+')':''}</button>`);inqCount()};
async function inqCount(){try{const r=await sb.from('inquiries').select('id',{count:'exact',head:true}).eq('status','new');if(r.error||typeof r.count!=='number')return;if(r.count!==INQN){INQN=r.count;const b=document.querySelector('[data-a=inqbox]');if(b)b.textContent='문의함'+(INQN?' ('+INQN+')':'')}}catch(_){}}
async function inqBox(){
$('#sp').innerHTML='<h2>문의함</h2><p class="mut">불러오는 중...</p>';$('#sh').hidden=false;
try{const r=await sb.from('inquiries').select('*').order('created_at',{ascending:false}).limit(50);if(r.error)throw r.error;const rows=Array.isArray(r.data)?r.data:[];
const t=x=>{const q=sp(x);return md(q.d)+' '+pad(q.h)+':'+pad(q.m)};
$('#sp').innerHTML=`<h2>문의함</h2>${rows.map(x=>`<div class="iqrow${x.status==='done'?' done':''}"><div class="meta"><span><b>${esc(x.kind||'')}</b> · ${esc(x.author_name||'이름 없음')}</span><span>${t(x.created_at)}</span></div><div class="bd">${esc(x.body||'')}</div><div class="meta"><span style="word-break:break-all">${esc((x.page||'')+' · '+(x.device||'').slice(0,60))}</span></div><div class="iqbtn">${x.status==='done'?'<span class="mut">처리 완료</span>':`<button type="button" data-a="inqdone" data-i="${x.id}">처리 완료</button>`}<button type="button" data-a="inqdel" data-i="${x.id}" style="color:var(--fat)">삭제</button></div></div>`).join('')||'<p class="empty">아직 문의가 없어요.</p>'}<button class="save" data-a="shut" style="background:none;color:var(--mut);margin-top:12px">닫기</button>`;
INQN=rows.filter(x=>x.status==='new').length;const b=document.querySelector('[data-a=inqbox]');if(b)b.textContent='문의함'+(INQN?' ('+INQN+')':'')
}catch(e){$('#sp').innerHTML='<h2>문의함</h2><p class="mut">불러오지 못했어요: '+esc(e.message||'')+'</p><button class="save" data-a="shut">닫기</button>'}}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-a^=ft_],[data-a=inqsave],[data-a=inqbox],[data-a=inqdone],[data-a=inqdel]');if(!b)return;const a=b.dataset.a;
if(a==='ft_terms')return pageSheet('이용약관',TOS_HTML());
if(a==='ft_priv')return pageSheet('개인정보처리방침',privBody());
if(a==='ft_inq')return inqSheet();
if(a==='inqbox')return inqBox();
if(busy)return;busy=true;try{
if(a==='inqsave'){const body=($('#f_iq').value||'').trim();if(!body)return toast('내용을 입력해 주세요');
const r=await sb.from('inquiries').insert({user_id:me.id,author_name:(me.p&&me.p.display_name)||'',kind:gv('iq')[0]||'문의',body,device:navigator.userAgent.slice(0,200),page:(location.hash||'#today')+' · v'+APP_VER});if(r.error)throw r.error;closeS();toast('보냈어요. 확인 후 답변드릴게요')}
else if(a==='inqdone'){const r=await sb.from('inquiries').update({status:'done'}).eq('id',b.dataset.i);if(r.error)throw r.error;busy=false;return inqBox()}
else if(a==='inqdel'){if(!confirm('이 문의를 삭제할까요?'))return;const r=await sb.from('inquiries').delete().eq('id',b.dataset.i);if(r.error)throw r.error;busy=false;return inqBox()}
}catch(err){toast('처리하지 못했어요: '+(err.message||''))}finally{busy=false}});
</script>
<script type="text/app">
/* ===== 알림 (홈 화면에 추가한 앱에서 푸시 알림 받기) ===== */
const PUSH_OK=()=>'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;
const b64u=s=>{const p='='.repeat((4-s.length%4)%4),b=(s+p).replace(/-/g,'+').replace(/_/g,'/'),r=atob(b);return Uint8Array.from([...r].map(c=>c.charCodeAt(0)))};
let NP=null;const NPDEF={meal:true,meal_b:true,meal_l:true,lesson:true,note:true,inquiry:true,meal_hour:20,meal_hour_b:9,meal_hour_l:13};
async function pushReg(){const reg=await navigator.serviceWorker.register('sw.js');await navigator.serviceWorker.ready;return reg}
async function pushSub(){if(!PUSH_OK())return null;try{const reg=await navigator.serviceWorker.getRegistration();return reg?await reg.pushManager.getSubscription():null}catch(_){return null}}
function acctPush(){
if(!me||!me.p||viewAs)return;const sp=$('#sp'),el=sp&&sp.querySelector('[data-a="saveg"]');if(!el)return;
const staff=['trainer','admin'].includes(me.p.role);
const mealCk=(k,t,hk,hs)=>`<div class="npk"><label style="flex:1;display:flex;align-items:center;gap:8px"><input type="checkbox" data-np="${k}"> ${t}</label><select data-np="${hk}" class="sel" style="width:auto">${hs.map(h=>`<option value="${h}">${h}시</option>`).join('')}</select></div>`;
const ck=(k,t)=>`<label class="npk"><input type="checkbox" data-np="${k}"> ${t}</label>`;
el.insertAdjacentHTML('afterend',`<div id="npbox" class="npbox"><div class="row"><span>알림</span><b id="npst">확인 중...</b></div><div id="npopt" hidden>${staff?ck('inquiry','새 문의 알림'):mealCk('meal_b','아침 식사 기록 알림','meal_hour_b',[7,8,9,10])+mealCk('meal_l','점심 식사 기록 알림','meal_hour_l',[11,12,13,14])+mealCk('meal','저녁 식사 기록 알림','meal_hour',[18,19,20,21,22])+ck('lesson','수업 하루 전 알림 (오후 6시)')+ck('note','트레이너 메모 알림')}<button type="button" class="cp" data-a="pushtest" style="margin-top:8px">테스트 알림 보내기</button></div><button class="save" data-a="pushon" id="npbtn" style="margin-top:8px;background:var(--pt);color:var(--pine)" hidden>알림 켜기</button><p class="mut" id="npnote" style="font-size:12px;margin:6px 0 0" hidden></p></div>`);
pushRefresh();
}
async function pushRefresh(){
const st=$('#npst'),btn=$('#npbtn'),opt=$('#npopt'),nt=$('#npnote');if(!st)return;
if(me.p.is_demo){st.textContent='샘플은 사용 불가';return}
if(!PUSH_OK()){st.textContent='사용할 수 없어요';nt.hidden=false;nt.textContent='아이폰은 사파리에서 홈 화면에 추가한 앱으로 열어야 알림을 켤 수 있어요. 갤럭시는 크롬에서 열어 주세요.';return}
if(Notification.permission==='denied'){st.textContent='차단됨';nt.hidden=false;nt.textContent='기기 설정에서 이 앱의 알림을 허용해 주세요.';return}
const sub=await pushSub();
if(!$('#npst'))return;
if(sub){st.textContent='켜짐';btn.hidden=false;btn.textContent='알림 끄기';btn.dataset.a='pushoff';opt.hidden=false;await pushPrefsLoad()}
else{st.textContent='꺼짐';btn.hidden=false;btn.textContent='알림 켜기';btn.dataset.a='pushon';opt.hidden=true}
}
async function pushPrefsLoad(){
try{const r=await sb.from('notif_prefs').select('*').eq('user_id',me.id).maybeSingle();NP=r.data||NPDEF}catch(_){NP=NPDEF}
document.querySelectorAll('[data-np]').forEach(i=>{const k=i.dataset.np;if(i.type==='checkbox')i.checked=NP[k]!==false;else i.value=String(NP[k]??NPDEF[k]??20)});
}
async function pushPrefsSave(){
const o={user_id:me.id,updated_at:new Date().toISOString()};document.querySelectorAll('[data-np]').forEach(i=>{o[i.dataset.np]=i.type==='checkbox'?i.checked:+i.value});
const r=await sb.from('notif_prefs').upsert(o,{onConflict:'user_id'});if(r.error)throw r.error;toast('알림 설정을 저장했어요')}
document.addEventListener('change',async e=>{if(!e.target.dataset||e.target.dataset.np==null)return;try{await pushPrefsSave()}catch(err){toast('저장하지 못했어요: '+(err.message||''))}});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-a=pushon],[data-a=pushoff],[data-a=pushtest]');if(!b)return;const a=b.dataset.a;
if(busy)return;busy=true;
try{
if(a==='pushon'){
 if(Notification.permission!=='granted'){const p=await Notification.requestPermission();if(p!=='granted'){toast('알림을 허용하지 않았어요');return pushRefresh()}}
 const reg=await pushReg();let sub=await reg.pushManager.getSubscription();
 if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(PUSH_PUBLIC_KEY)});
 const j=sub.toJSON(),r=await sb.from('push_subscriptions').upsert({user_id:me.id,endpoint:j.endpoint,p256dh:j.keys.p256dh,auth:j.keys.auth,ua:navigator.userAgent.slice(0,200)},{onConflict:'endpoint'});if(r.error)throw r.error;
 const q=await sb.from('notif_prefs').upsert({user_id:me.id},{onConflict:'user_id',ignoreDuplicates:true});
 toast('알림을 켰어요');await pushRefresh()}
else if(a==='pushoff'){
 const sub=await pushSub();if(sub){const ep=sub.endpoint;await sub.unsubscribe();await sb.from('push_subscriptions').delete().eq('endpoint',ep)}
 toast('알림을 껐어요');await pushRefresh()}
else if(a==='pushtest'){
 const r=await sb.functions.invoke('push-cron',{body:{test:true}});if(r.error)throw r.error;
 const d=r.data||{};toast(d.sent?'테스트 알림을 보냈어요. 잠시 후 도착해요':'보낼 곳이 없어요. 알림을 다시 켜 주세요')}
}catch(err){toast('처리하지 못했어요: '+(err.message||''))}finally{busy=false}});
</script>
<script type="text/app">
/* --- 화면 색상 테마 (이 기기에만 저장): 화이트핑크(기본) / 핑크 / 모노 --- */
const THEMES={white:'스완 레이크',rain:'레인',market:'파머스 마켓',berry:'스트로베리',mono:'모노'};
const RPT={white:{bg:'#FBE7E0',line:'#F9D0CD',ink:'#4A3B3A',mut:'#9A8884',p:'#EC9D97',h1:'#F9D0CD',h2:'#EC9D97',fut:'#FDF3EF',futb:'#F9D0CD',ok:'#2f7d57'},rain:{bg:'#E9F3F1',line:'#C7E5EE',ink:'#3A4660',mut:'#7D8AA0',p:'#8294AF',h1:'#C7E5EE',h2:'#A6BAD6',fut:'#F3F9F8',futb:'#C7E5EE',ok:'#8294AF'},market:{bg:'#EEECD6',line:'#D6D2A5',ink:'#3C4A2A',mut:'#7F8466',p:'#699543',h1:'#D6D2A5',h2:'#A2A93E',fut:'#F6F4E6',futb:'#D6D2A5',ok:'#699543'},berry:{bg:'#FFEECB',line:'#FECBCB',ink:'#5A3A2A',mut:'#A0806A',p:'#E63F25',h1:'#FECBCB',h2:'#E63F25',fut:'#FFF6E0',futb:'#FECBCB',ok:'#799E60'},mono:{bg:'#F7F6F5',line:'#E5E3E0',ink:'#22211F',mut:'#7A7874',p:'#22211F',h1:'#E5E3E0',h2:'#A9A6A2',fut:'#F1F0EE',futb:'#E5E3E0',ok:'#5C5B58'}};
function theme(){try{const t=localStorage.getItem('theme');return THEMES[t]?t:'white'}catch(e){return'white'}}
function applyTheme(t){if(!THEMES[t])t='white';try{localStorage.setItem('theme',t)}catch(e){}
if(t==='white')document.documentElement.removeAttribute('data-theme');else document.documentElement.dataset.theme=t;
const m=document.querySelector('meta[name=theme-color]');if(m)m.content=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim()||'#FBE7E0'}
function acctTheme(){acctSlot(`<div class="mut" style="margin:14px 0 6px">화면 색상 (이 기기에만 적용)</div><div class="chips" id="thm">${Object.keys(THEMES).map(k=>`<button type="button" class="chip${theme()===k?' on':''}" data-a="theme" data-v="${k}">${THEMES[k]}${k==='white'?' (기본)':''}</button>`).join('')}</div>`)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a=theme]');if(!b)return;applyTheme(b.dataset.v);document.querySelectorAll('#thm .chip').forEach(x=>x.classList.toggle('on',x===b))});
applyTheme(theme());

/* ===== 어제 식사 복사 / 트레이너 주간 요약 / 비밀번호 변경 ===== */

/* --- 어제 식사 복사: 그날 아직 기록이 없는 끼니만, 어제 먹은 그대로 가져와요 --- */
function ycands(){const have=new Set(dm(day).map(x=>x.t));return dm(addDays(day,-1)).filter(x=>!have.has(x.t))}
function ycopyBtn(){if(isRO())return'';const n=ycands().length;return n?`<button type="button" class="save" data-a="ycopy" style="background:none;color:var(--pine);border:1px solid var(--line);margin:8px 0 0">어제 식사 가져오기 (${n}건)</button>`:''}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-a=ycopy]');if(!b)return;if(isRO())return toast(roMsg());if(busy)return;
const src=ycands();if(!src.length)return toast('가져올 식사가 없어요');busy=true;
try{const r=await sb.from('meal_logs').insert(src.map(x=>({user_id:OID(),log_date:day,meal_type:x.t,name:x.n,amount:x.amt||null,items:x.it||null,calories:x.k,carb_g:x.c,protein_g:x.p,fat_g:x.f}))).select();
if(r.error)throw r.error;(r.data||[]).forEach(x=>S.meals.push(mapMeal(x)));render();toast('어제 식사 '+(r.data||[]).length+'건을 가져왔어요')}
catch(x){toast('가져오지 못했어요: '+(x.message||''))}finally{busy=false}});

/* --- 트레이너 주간 요약: 월~일 한 주를 색 칸으로 훑고, 회원을 누르면 아래에 그래프 --- */
var WK=null,wkStart='',wkSel='',repCtx=null,mwStart='';
const WKD=['월','화','수','목','금','토','일'];
function monOf(d){const w=new Date(d+'T12:00:00').getDay();return addDays(d,-((w+6)%7))}
const slHM=m=>Math.floor(m/60)+'시간 '+String(Math.round(m%60)).padStart(2,'0')+'분';
const wkLab=s=>{const f=d=>d.slice(5).replace('-','.')+' ('+WKD[(new Date(d+'T12:00:00').getDay()+6)%7]+')';return f(s)+' ~ '+f(addDays(s,6))};
async function loadWeek(){const today=baseDay();if(!wkStart)wkStart=monOf(today);const to=addDays(wkStart,6),ps=(me.members||[]);
const rg=t=>t.gte('log_date',wkStart).lte('log_date',to);
const[m,w,b,sl,l]=await Promise.all([
qAll(()=>rg(sb.from('meal_logs').select('user_id,log_date,meal_type,calories')).order('id')),
qAll(()=>rg(sb.from('workout_logs').select('user_id,log_date')).order('id')),
qAll(()=>rg(sb.from('body_logs').select('user_id,log_date,weight')).order('log_date').order('id')),
qAll(()=>rg(sb.from('sleep_logs').select('user_id,log_date,minutes')).order('id')),
qAll(()=>sb.from('lessons').select('member_id,kind,status,start_at').gte('start_at',wkStart+'T00:00:00+09:00').lte('start_at',to+'T23:59:59+09:00').order('start_at'))]);
const goal={};((DASH&&DASH.rows)||[]).forEach(r=>goal[r.p.id]=r.goal);
const dates=[0,1,2,3,4,5,6].map(i=>addDays(wkStart,i)),ix=d=>dates.indexOf(d),mm={};
ps.forEach(p=>{mm[p.id]={p,ty:dates.map(()=>new Set()),kc:dates.map(()=>null),wo:dates.map(()=>0),wt:dates.map(()=>null),sl:dates.map(()=>null),ls:0,lsd:dates.map(()=>0),goal:goal[p.id]||1735}});
(m.data||[]).forEach(r=>{const o=mm[r.user_id],i=ix(r.log_date);if(!o||i<0)return;o.ty[i].add(r.meal_type);o.kc[i]=(o.kc[i]||0)+(+r.calories||0)});
(w.data||[]).forEach(r=>{const o=mm[r.user_id],i=ix(r.log_date);if(o&&i>=0)o.wo[i]++});
(b.data||[]).forEach(r=>{const o=mm[r.user_id],i=ix(r.log_date);if(o&&i>=0&&r.weight!=null)o.wt[i]=+r.weight});
(sl.data||[]).forEach(r=>{const o=mm[r.user_id],i=ix(r.log_date);if(o&&i>=0&&r.minutes)o.sl[i]=+r.minutes});
(l.data||[]).forEach(r=>{const o=mm[r.member_id];if(o&&r.status!=='cancelled'&&(r.kind==='PT'||r.kind==='OT')&&sp(r.start_at).d<=today){o.ls++;const i=ix(sp(r.start_at).d);if(i>=0)o.lsd[i]++}});
const el=today<wkStart?0:Math.min(7,diff(wkStart,today)+1);
WK={start:wkStart,dates,el,rows:Object.values(mm).map(o=>wkCalc(o,el))}}
/* 한 주치 원자료(o) -> 표에 쓰는 값들 (트레이너 표와 회원 화면이 같이 써요) */
function wkCalc(o,el){const av=a=>{const v=a.filter(x=>x!=null);return v.length?v.reduce((t,x)=>t+x,0)/v.length:null},
md=o.kc.filter(x=>x!=null).length,wn=o.wo.reduce((t,x)=>t+x,0),wv=o.wt.filter(x=>x!=null),a=av(o.kc);
return{...o,md,wn,avg:a==null?null:Math.round(a),wlast:wv.length?wv[wv.length-1]:null,dw:wv.length>1?Math.round((wv[wv.length-1]-wv[0])*10)/10:null,slAvg:av(o.sl),low:el>=3&&(md*2<el||wn===0)}}
/* 회원 본인(또는 트레이너가 열어 둔 회원)의 한 주: 이미 불러온 기록으로 계산해요 */
function memWeek(start){const td=baseDay(),dates=[0,1,2,3,4,5,6].map(i=>addDays(start,i)),ix=d=>dates.indexOf(d),z=v=>dates.map(()=>v),
o={p:{id:OID(),display_name:(viewAs?viewAs.name:(me.p&&me.p.display_name))||''},ty:dates.map(()=>new Set()),kc:z(null),wo:z(0),wt:z(null),sl:z(null),ls:0,lsd:z(0),goal:(S.goal&&S.goal.k)||1735};
S.meals.forEach(x=>{const i=ix(x.d);if(i<0)return;o.ty[i].add(x.t);o.kc[i]=(o.kc[i]||0)+(+x.k||0)});
S.workouts.forEach(x=>{const i=ix(x.d);if(i>=0)o.wo[i]++});
[...S.body].sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:0).forEach(x=>{const i=ix(x.d);if(i>=0&&x.w!=null)o.wt[i]=x.w});
(S.sleep||[]).forEach(x=>{const i=ix(x.d);if(i>=0&&x.m)o.sl[i]=x.m});
(S.lessons||[]).forEach(x=>{const i=ix(x.d);if(i>=0&&x.status!=='cancelled'&&(x.kind==='PT'||x.kind==='OT')&&x.d<=td){o.ls++;o.lsd[i]++}});
const el=td<start?0:Math.min(7,diff(start,td)+1);return{start,dates,el,row:wkCalc(o,el)}}
const WKC=['var(--line)','var(--hl1)','var(--hl2)','var(--pine)'];
function wkSvg(r){const H=90,V=r.kc.filter(x=>x!=null),mx=Math.max(...V,r.goal)*1.15,gy=H-r.goal/mx*H,
kb=r.kc.map((k,i)=>k==null?'':`<rect x="${8+i*20}" y="${(H-k/mx*H).toFixed(1)}" width="14" height="${(k/mx*H).toFixed(1)}" rx="3" fill="${k>r.goal*1.2?'#d9534f':'var(--pine)'}"/>`).join(''),
kcal=`<svg width="100%" viewBox="0 0 150 ${H+4}" height="${H+4}">${kb}<line x1="0" x2="150" y1="${gy.toFixed(1)}" y2="${gy.toFixed(1)}" stroke="var(--mut)" stroke-dasharray="3 3"/></svg>`,
wv=r.wt.map((x,i)=>x==null?null:[i,x]).filter(Boolean),lo=Math.min(...wv.map(p=>p[1])),hi=Math.max(...wv.map(p=>p[1])),rg=(hi-lo)||1,
pt=wv.map(p=>[(p[0]*22+8).toFixed(1),(H-6-(p[1]-lo)/rg*(H-14)).toFixed(1)]),
wgt=wv.length?`<svg width="100%" viewBox="0 0 150 ${H}" height="${H}">${pt.length>1?`<polyline points="${pt.map(p=>p.join(',')).join(' ')}" fill="none" stroke="var(--pine)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>`:''}${pt.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.4" fill="var(--pine)"/>`).join('')}</svg>`:'<p class="mut" style="font-size:12px;margin:30px 0">기록이 없어요</p>',
sb=r.sl.map((s,i)=>s==null?'':`<rect x="${8+i*20}" y="${(H-s/540*H).toFixed(1)}" width="14" height="${(s/540*H).toFixed(1)}" rx="3" fill="var(--sl)"/>`).join(''),
slp=r.slAvg==null?'<p class="mut" style="font-size:12px;margin:30px 0">기록이 없어요</p>':`<svg width="100%" viewBox="0 0 150 ${H+4}" height="${H+4}">${sb}</svg>`;
return{kcal,wgt,slp}}
function wkPanel(r,dates,link){if(!r)return'';const s=wkSvg(r),td=baseDay(),
dots=['<div class="wdr"><em></em>'+dates.map((d,i)=>`<small class="${d===td?'td':''}">${WKD[i]}</small>`).join('')+'</div>',
'<div class="wdr"><em>운동</em>'+dates.map((d,i)=>`<span class="${r.wo[i]?'on w':''}" style="${d>td?'opacity:.35':''}"></span>`).join('')+'</div>',
'<div class="wdr"><em>수업</em>'+dates.map((d,i)=>`<span class="${r.lsd[i]?'on l':''}" style="${d>td?'opacity:.35':''}"></span>`).join('')+'</div>'].join(''),
C=(t,sub,b)=>`<div class="wdc"><div class="wdt">${t}</div><div class="wds">${sub}</div>${b}</div>`,
wv=r.wt.filter(x=>x!=null);
return`<div class="wpan"><div class="wph"><b>${esc(r.p.display_name)}</b><span class="mut"> · ${wkLab(dates[0])}</span>${link?`<button type="button" class="wlk" data-a="vm" data-i="${r.p.id}" data-n="${esc(r.p.display_name)}">회원 기록 열기 ›</button>`:''}</div><div class="wdg${link?'':' two'}">`
+C('식사 열량 (kcal)','점선 = 목표 '+r.goal.toLocaleString()+' kcal',s.kcal)
+C('체중 (kg)',wv.length>1?wv[0]+' → '+wv[wv.length-1]+' kg':wv.length?wv[0]+' kg':'-',s.wgt)
+C('수면',r.slAvg==null?'-':'하루 평균 '+slHM(r.slAvg),s.slp)
+C('운동 / 수업 (회)','운동 '+r.wn+'회 · 수업 '+r.ls+'회','<div class="wdots">'+dots+'</div>')+'</div><button type="button" class="cp" data-a="wrep" style="margin-top:12px">리포트 이미지로 저장</button></div>'}
function weekHTML(){if(!WK)return'<p class="empty">주간 요약을 불러오지 못했어요. 새로고침을 눌러 주세요.</p>';
const R=WK.rows,tot=R.length,el=WK.el,td=baseDay(),cur=WK.start>=monOf(td),nLow=R.filter(r=>r.low).length,sumW=R.reduce((t,r)=>t+r.wn,0),sumL=R.reduce((t,r)=>t+r.ls,0),
avgMd=tot&&el?(R.reduce((t,r)=>t+r.md,0)/tot).toFixed(1):'0';
const nav=`<div class="wknav"><button type="button" class="cp" data-a="wkmv" data-v="-7">◀ 이전 주</button><b>${wkLab(WK.start)}</b><button type="button" class="cp" data-a="wkmv" data-v="7" ${cur?'disabled':''}>다음 주 ▶</button></div>`;
const tiles=`<div class="tiles"><div class="tile"><span>평균 식사 기록</span><b>${avgMd}<small>/${el}일</small></b></div><div class="tile"><span>운동 / 수업 합계</span><b>${sumW}<small>회</small> / ${sumL}<small>회</small></b></div><div class="tile"><span>회원 수</span><b>${tot}<small>명</small></b></div><div class="tile${nLow?' warn':''}"><span>기록 부진</span><b>${nLow}<small>명</small></b></div></div>`;
const hd=WKD.map((d,i)=>`<span class="${WK.dates[i]===td?'td':''}">${d}</span>`).join('');
const row=r=>{const cells=WK.dates.map((d,i)=>`<i class="${d>td?'fu':''}${d===td?' td':''}" style="${d>td?'':'background:'+WKC[Math.min(3,r.ty[i].size)]}">${r.wo[i]?'<b></b>':''}</i>`).join(''),
over=r.avg!=null&&r.avg>r.goal*1.2;
return`<tr class="${r.low?'lw ':''}${wkSel===r.p.id?'sel':''}" data-a="wksel" data-i="${r.p.id}"><td class="l"><b>${esc(r.p.display_name)}</b></td><td><div class="whm">${cells}</div></td><td><b class="wb${over?' up':''}">${r.avg==null?'-':r.avg.toLocaleString()}</b><small class="wsm">목표 ${r.goal.toLocaleString()}</small></td><td><b class="wb">${r.wlast==null?'-':r.wlast}</b><small class="wsm">${r.dw==null?'&nbsp;':'주간 '+(r.dw>0?'+':'')+r.dw}</small></td><td class="wsc"><b class="wb">${r.slAvg==null?'-':slHM(r.slAvg)}</b></td><td><b class="wb">${r.wn} / ${r.ls}</b></td></tr>`};
const leg=`<div class="wlg"><span><i style="background:var(--line)"></i>기록 없음</span><span><i style="background:var(--hl1)"></i>1끼</span><span><i style="background:var(--hl2)"></i>2끼</span><span><i style="background:var(--pine)"></i>3끼 이상</span><span><i style="background:var(--ok);border-radius:50%"></i>운동한 날</span><span><i class="fu"></i>아직 안 온 날</span></div>`;
const sel=R.find(r=>r.p.id===wkSel);repCtx=sel?{r:sel,dates:WK.dates,el:WK.el}:null;
return nav+tiles+(tot?`<div class="wkscroll"><table class="wkt"><thead><tr><th class="l">회원</th><th><div class="wth">${hd}</div></th><th>평균 섭취 (kcal)</th><th>체중 (kg)</th><th class="wsc">평균 수면</th><th>운동/수업 (회)</th></tr></thead><tbody>${[...R].sort((x,y)=>(y.low-x.low)||(x.p.display_name<y.p.display_name?-1:1)).map(row).join('')}</tbody></table></div>${leg}${wkPanel(sel,WK.dates,true)}<p class="mut" style="font-size:12px;margin-top:10px">오늘까지만 집계해요. 줄을 누르면 아래에 그 회원의 그래프가 펼쳐져요. 샘플 계정은 제외돼요.</p>`:'<p class="empty">회원이 없어요.</p>')}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-a=wkmv],tr[data-a=wksel]');if(!b||b.disabled)return;
if(b.dataset.a==='wksel'){wkSel=wkSel===b.dataset.i?'':b.dataset.i;renderDash();const p=document.querySelector('.wpan');if(p&&wkSel)p.scrollIntoView({block:'nearest',behavior:'smooth'});return}
wkStart=addDays(WK?WK.start:monOf(baseDay()),+b.dataset.v);if(wkStart>monOf(baseDay()))wkStart=monOf(baseDay());
try{await loadWeek()}catch(x){WK=null}renderDash()});

<div class="row"><span>체중 (kg)</span><b>${r.wlast==null?'-':r.wlast}${r.dw==null?'':' <small class="mut">주간 '+(r.dw>0?'+':'')+r.dw+'</small>'}</b></div>

document.addEventListener('click',e=>{const b=e.target.closest('[data-a=mwopen],[data-a=mwmv]');if(!b||b.disabled)return;

// 숫자 4칸
