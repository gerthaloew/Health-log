<script>
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const baseDay=()=>fmt(new Date(Date.now()-5*36e5)); // 새벽 5시 전 기록은 전날로 계산
const addDays=(k,n)=>{const d=new Date(k+'T12:00:00');d.setDate(d.getDate()+n);return fmt(d)};

const TYPES=['아침','점심','저녁','간식'];
let S={meals:[],workouts:[],body:[],cycle:[]},day=baseDay();

S.goal=S.goal||{c:220,p:90,f:55};S.goal.k=S.goal.c*4+S.goal.p*4+S.goal.f*9;S.dday=S.dday||[];
function save(){}
function seed(){const t=baseDay();S.sample=1;
S.meals=[{id:1,d:t,t:'아침',n:'오트밀과 바나나',k:320,c:58,p:11,f:6},{id:2,d:t,t:'점심',n:'닭가슴살 샐러드',k:410,c:28,p:38,f:14},{id:3,d:t,t:'간식',n:'그릭요거트',k:140,c:9,p:15,f:4},{id:4,d:addDays(t,-1),t:'저녁',n:'연어 포케',k:560,c:62,p:30,f:20}];
S.workouts=[{id:5,d:addDays(t,-1),g:['Personal Training'],b:['하체'],n:'스쿼트, 불가리안 스플릿 스쿼트',k:290,c:'상'}];
S.body=[];for(let i=0;i<10;i++)S.body.push({id:10+i,d:addDays(t,-(27-i*3)),w:+(62.4-i*.17).toFixed(1),...(i==9?{m:23.1,f:15.8}:{})});
S.cycle=[addDays(t,-76),addDays(t,-48),addDays(t,-20)];}

const sum=(a,f)=>a.reduce((s,x)=>s+(+x[f]||0),0),dm=k=>S.meals.filter(m=>m.d===k),dw=k=>S.workouts.filter(w=>w.d===k);
const tab=()=>{const h=location.hash.slice(1);return['today','meals','workouts','body'].includes(h)?h:'today'};
const guess=()=>{const h=new Date().getHours();return h<10?'아침':h<15?'점심':h<20?'저녁':'간식'};
function head(t,nav=true){const d=new Date(day+'T12:00:00'),b=baseDay(),lab=day===b?'오늘, ':day===addDays(b,-1)?'어제, ':'';
return`<header class="top"><h1><span>${t}</span>${t==='오늘'?'<span><button class="gear" data-a="goal">목표 설정</button> <button class="gear" data-a="acct">계정</button></span>':''}</h1>${nav?`<div class="dn"><button data-a="prev" aria-label="전날">‹</button><span>${lab}${md(day)} (${'일월화수목금토'[d.getDay()]})</span><button data-a="next" aria-label="다음날" ${day>=b?'disabled':''}>›</button></div>`:''}</header>${S.sample?'<div class="ban"><span>샘플 데이터가 들어 있어요.</span><button data-a="clear">샘플 지우기</button></div>':''}`}
const bar=(l,v,g,c)=>`<div class="mb"><div class="ml"><span>${l}</span><b>${Math.round(v)}<i> / ${g}g</i></b></div><div class="bt"><div class="bf ${c}" style="width:${Math.min(v/g*100,100)}%"></div></div></div>`;
const lastW=()=>[...S.body].filter(b=>b.w&&b.d<=day).sort((a,b)=>a.d<b.d?1:-1)[0];
const shrink=f=>new Promise((ok,no)=>{const r=new FileReader();r.onerror=no;r.onload=()=>{const i=new Image();i.onerror=no;i.onload=()=>{const s=Math.min(1,480/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*s);c.height=Math.round(i.height*s);c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.7))};i.src=r.result};r.readAsDataURL(f)});
const ph=(a,n=6)=>{const p=a.filter(x=>x.img).slice(0,n);return p.length?`<div class="ths">${p.map(x=>`<img class="th" data-a="det" data-k="meal" data-t="${x.t}" src="${x.img}" alt="${esc(x.n)}">`).join('')}</div>`:''};
const wt=x=>x.y&&x.y.length?x.y:[...new Set([...(x.g||[]).filter(p=>p==='필라테스'),...(x.b||[]).map(p=>p==='유산소'||p==='필라테스'?p:'웨이트')])];
function ddCard(){const t=baseDay(),a=[...S.dday].sort((x,y)=>{const p=u=>u.d<t?1:0;return p(x)-p(y)||(x.d<y.d?-1:1)});if(!a.length)return'';return`<section class="card"><h3>디데이</h3>${a.slice(0,3).map(x=>{const n=diff(t,x.d);return`<div class="row"><span class="n">${esc(x.n)}<small>${md(x.d)}</small></span><b class="cy2">${n===0?'D-Day':n>0?'D-'+n:'D+'+(-n)}</b></div>`}).join('')}</section>`}
function vToday(){const m=dm(day),w=dw(day),eat=sum(m,'k'),burn=sum(w,'k'),cap=S.goal.k+burn,left=cap-eat,C=2*Math.PI*54,pct=Math.min(eat/cap,1),bw=lastW(),ib=[...S.body].filter(b=>(b.m||b.f)&&b.d<=day).sort((a,b)=>a.d<b.d?1:-1)[0],bp=ib&&ib.f&&(ib.w||(bw&&bw.w))?(ib.f/(ib.w||bw.w)*100).toFixed(1):null,bcHtml=ib?`<div class="mut" style="margin-top:8px">골격근 ${ib.m||'-'} kg<br>체지방 ${ib.f||'-'} kg<br>체지방률 ${bp?bp+'%':'-'}</div>`:'',wn=[...new Set(w.flatMap(wt))];
const rows=TYPES.map(t=>{const a=m.filter(x=>x.t===t);return a.length?`<div class="row tap" role="button" tabindex="0" data-a="det" data-k="meal" data-t="${t}"><span class="n">${t}<small>${a.map(x=>esc(x.n)).join(', ')}</small></span><b>${sum(a,'k')} kcal</b></div>`:''}).join('');
return head('오늘')+ddCard()+`<section class="card hero"><div class="rw"><svg viewBox="0 0 140 140"><circle class="tr" cx="70" cy="70" r="54"/><circle class="pg ${left<0?'over':''}" cx="70" cy="70" r="54" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-pct)}" transform="rotate(-90 70 70)"/></svg><div class="rc"><b>${Math.abs(left)}</b><small>${left<0?'kcal 초과':'kcal 남음'}</small></div></div>

function cyc(){const s=[...S.cycle].sort();if(!s.length)return null;let avg=28;if(s.length>1){const d=[];for(let i=1;i<s.length;i++)d.push(diff(s[i-1],s[i]));avg=Math.round(d.reduce((a,b)=>a+b)/d.length)}const last=s[s.length-1];return{last,avg,next:addDays(last,avg),n:s.length}}
function chart(){const a=[...S.body].filter(b=>b.w).sort((x,y)=>x.d<y.d?-1:1).slice(-30);if(a.length<2)return'<p class="empty">체중을 2번 이상 기록하면 그래프가 보여요.</p>';
const W=320,H=130,P=14,v=a.map(b=>b.w),mn=Math.min(...v)-.3,mx=Math.max(...v)+.3,X=i=>P+i*(W-2*P)/(a.length-1),Y=x=>P+(mx-x)*(H-2*P)/(mx-mn),p=a.map((b,i)=>X(i).toFixed(1)+','+Y(b.w).toFixed(1));

function wUpdate(){wq=($('#wq')||{value:''}).value.trim();wf={p:gv('sp'),c:gv('sc')};const on=!!(wq||wf.p.length||wf.c.length),m=$('#main'),r=$('#wres');if(m)m.classList.toggle('wsearching',on);if(r)r.innerHTML=wResHTML()}
async function loadWx(){const uid=viewAs?viewAs.id:me.id,q=t=>fetchAll(t,uid);
try{const[a,b,c]=await Promise.all([q('workout_sets'),q('workout_cardio'),q('user_exercises')]);S.myex=(!c.error&&c.data)||[];const st={},cd={};
(a.data||[]).forEach(r=>{(st[r.workout_id]=st[r.workout_id]||[]).push({n:r.exercise,no:r.set_no,w:r.weight_kg,r:r.reps})});
(b.data||[]).forEach(r=>{(cd[r.workout_id]=cd[r.workout_id]||[]).push({n:r.name,i:r.intensity,m:r.duration_min,k:r.calories})});
S.workouts.forEach(x=>{x.sets=(st[x.id]||[]).sort((p,q)=>p.no-q.no);x.cardio=cd[x.id]||[]})}catch(e){}}
const _la=loadAll;loadAll=async function(){await _la();await loadWx();render()};
const _rd=render;render=function(){_rd();const m=$('#main');if(m)m.classList.toggle('wsearching',tab()==='workouts'&&!!(wq||(wf.p||[]).length||(wf.c||[]).length))};
document.addEventListener('input',e=>{const t=e.target,d=t.dataset||{};
if(d.f&&d.i!=null&&d.j!=null&&wd.ex[+d.i])wd.ex[+d.i].sets[+d.j][d.f]=t.value;
else if(d.c&&d.i!=null&&wd.cd[+d.i])wd.cd[+d.i][d.c]=t.value;
else if(t.id==='wq')wUpdate()});
document.addEventListener('click',e=>{if(e.target.closest('[data-g="wb"] .chip'))refreshEx();if(e.target.closest('#wsb .chip'))wUpdate()});
document.addEventListener('change',e=>{const t=e.target;if(t.id!=='f_mp'&&t.id!=='f_ep')return;let v=t.value;if(!v)return;
if(v==='__new'){v=(prompt('종목 이름을 입력하세요')||'').trim();if(!v){refreshEx();return}addCustomEx(v)}
if(t.id==='f_mp'){if(!wd.main.includes(v))wd.main.push(v);drawMain()}else{wd.ex.push({n:v,sets:[{w:'',r:''}]});drawSets()}refreshEx()});

/* ===== 안정성: 전체 불러오기, 비밀번호 재설정, 저장 중복 방지, 수정/삭제 ===== */
var busy=false,recov=false;
async function fetchAll(t,uid){let all=[];for(let i=0;;i++){const r=await sb.from(t).select('*').eq('user_id',uid).order('id').range(i*1000,i*1000+999);if(r.error)return r;all=all.concat(r.data);if(r.data.length<1000)return{data:all,error:null}}}
function resetUI(){document.body.classList.remove('in');const a=overlay();a.innerHTML='<div class="ap"><h1>새 비밀번호</h1><p class="mut">새 비밀번호를 입력해 주세요 (6자 이상)</p><label>새 비밀번호<input id="a_np" type="password" autocomplete="new-password"></label><p id="a_err" style="color:var(--fat);font-size:13px;margin:0 0 10px"></p><button class="save" data-a="setpw">비밀번호 변경</button></div>'}
const _ds=doSave,_up=upd;
doSave=async function(k){if(busy)return;busy=true;const b=document.querySelector('.save[data-a="save"]');if(b){b.disabled=true;b.textContent='저장 중...'}try{await _ds(k)}finally{busy=false;if(b&&b.isConnected){b.disabled=false;b.textContent='저장'}}};
upd=async function(id){if(busy)return;busy=true;const b=document.querySelector('.save[data-a="upd"]');if(b){b.disabled=true;b.textContent='저장 중...'}try{await _up(id)}finally{busy=false;if(b&&b.isConnected){b.disabled=false;b.textContent='저장'}}};

function wGroup(x){const g=[],ix={};(x.sets||[]).forEach(s=>{if(ix[s.n]==null){ix[s.n]=g.length;g.push({n:s.n,sets:[]})}g[ix[s.n]].sets.push({w:s.w==null?'':s.w,r:s.r==null?'':s.r})});return g}
function wForm(x){x=x||null;wd=x?{main:x.n?x.n.split(', '):[],ex:wGroup(x),cd:(x.cardio||[]).map(c=>({n:c.n,i:c.i||'',m:c.m==null?'':c.m,k:c.k==null?'':c.k}))}:{main:[],ex:[],cd:[]};
$('#sp').innerHTML=`<h2>${x?'운동 수정':'운동 기록'}</h2><label>종류</label>${chips('wy',['웨이트','요가','필라테스','유산소','기타'],x?x.y||[]:[],1)}<label>구분</label>${chips('wg',['Personal Training','개인 운동','필라테스'],x?x.g||[]:[],1)}<label>부위</label>${chips('wb',['하체','어깨 가슴','등','유산소','필라테스'],x?x.b||[]:[],1)}<label>메인 운동</label><div id="mainsel" class="chips" style="margin:4px 0"></div><select id="f_mp" class="sel"></select><h3 class="sh3">세트 기록 (웨이트)</h3><div id="sets"></div><select id="f_ep" class="sel"></select><h3 class="sh3">유산소</h3><div id="cd"></div><button type="button" class="cp" data-a="addcd">+ 유산소 추가</button><label style="margin-top:14px">소모 열량 (kcal)<input id="f_k" inputmode="decimal" value="${x&&x.k?x.k:''}"></label><label>컨디션</label>${chips('wc',['상','중','하'],x&&x.c?[x.c]:[])}<label>특이사항<textarea id="f_nt" rows="3" placeholder="메모할 내용이 있으면 적어요">${x?esc(x.notes||''):''}</textarea></label>${x?`<button class="save" data-a="uwork" data-i="${x.id}">저장</button>`:'<button class="save" data-a="save" data-k="workout2">저장</button>'}`;refreshEx();drawMain();drawSets();drawCd();$('#sh').hidden=false}
async function uwork(id){const x=S.workouts.find(y=>String(y.id)===String(id));if(!x)return;
const ex=wd.ex.map(e=>({n:e.n,sets:e.sets.filter(s=>String(s.w).trim()||String(s.r).trim())})).filter(e=>e.sets.length),cd=wd.cd.filter(c=>c.n.trim()),kc=nv('k')||cd.reduce((t,c)=>t+(+c.k||0),0),
o={kinds:gv('wy'),categories:gv('wg'),parts:gv('wb'),main_exercise:wd.main.join(', '),calories:kc,condition:gv('wc')[0]||null,notes:$('#f_nt').value.trim()||null};
let r=await sb.from('workout_logs').update(o).eq('id',x.id);if(r.error)throw r.error;
r=await sb.from('workout_sets').delete().eq('workout_id',x.id);if(r.error)throw r.error;
r=await sb.from('workout_cardio').delete().eq('workout_id',x.id);if(r.error)throw r.error;
const rows=[];ex.forEach(e=>e.sets.forEach((s,j)=>rows.push({workout_id:x.id,user_id:me.id,exercise:e.n,set_no:j+1,weight_kg:parseFloat(s.w)||null,reps:parseInt(s.r)||null})));
if(rows.length){r=await sb.from('workout_sets').insert(rows);if(r.error)throw r.error}
if(cd.length){r=await sb.from('workout_cardio').insert(cd.map(c=>({workout_id:x.id,user_id:me.id,name:c.n.trim(),intensity:String(c.i).trim()||null,duration_min:parseFloat(c.m)||null,calories:parseInt(c.k)||null})));if(r.error)throw r.error}
Object.assign(x,{y:o.kinds,g:o.categories,b:o.parts,n:o.main_exercise,k:kc,c:o.condition||'',notes:o.notes||'',sets:rows.map(q=>({n:q.exercise,no:q.set_no,w:q.weight_kg,r:q.reps})),cardio:cd.map(c=>({n:c.n.trim(),i:String(c.i).trim(),m:parseFloat(c.m)||null,k:parseInt(c.k)||null}))});
closeS();render();toast('저장했어요')}

function bodyList(){const a=[...S.body].sort((x,y)=>x.d<y.d?1:-1).slice(0,8);if(!a.length)return'';
return`<section class="card"><h3>체중·인바디 기록<span class="mut" style="font-weight:400;font-size:12px">눌러서 수정</span></h3>${a.map(b=>`<div class="row tap" role="button" tabindex="0" data-a="bedit" data-i="${b.id}"><span class="n">${md(b.d)}<small>${[b.m?'골격근 '+b.m+' kg':'',b.f?'체지방 '+b.f+' kg':''].filter(Boolean).join(', ')}</small></span><b>${b.w?b.w+' kg':'-'}</b></div>`).join('')}</section>`}
function bodyEdit(id){const b=S.body.find(x=>String(x.id)===String(id));if(!b)return;
$('#sp').innerHTML=`<h2>체중·인바디 수정</h2><label>날짜<input id="f_bd" type="date" value="${b.d}"></label><label>체중 (kg)<input id="f_w" inputmode="decimal" value="${b.w==null?'':b.w}"></label><div class="g3" style="grid-template-columns:1fr 1fr"><label>골격근량<input id="f_m" inputmode="decimal" value="${b.m==null?'':b.m}"></label><label>체지방량<input id="f_f" inputmode="decimal" value="${b.f==null?'':b.f}"></label></div><button class="save" data-a="ubody" data-i="${b.id}">저장</button><button class="save" data-a="dbody" data-i="${b.id}" style="background:none;color:var(--fat);margin-top:0">삭제</button>`;$('#sh').hidden=false}
async function ubody(id){const b=S.body.find(x=>String(x.id)===String(id));if(!b)return;if(!fv('bd'))return toast('날짜를 선택해 주세요');if(!nv('w'))return toast('체중을 입력해 주세요');
const o={log_date:fv('bd'),weight:nv('w'),muscle_mass:nv('m')||null,body_fat_mass:nv('f')||null},r=await sb.from('body_logs').update(o).eq('id',b.id);if(r.error)throw r.error;
Object.assign(b,{d:o.log_date,w:o.weight,m:o.muscle_mass||undefined,f:o.body_fat_mass||undefined});closeS();render();toast('저장했어요')}
async function dbody(id){const r=await sb.from('body_logs').delete().eq('id',id);if(r.error)throw r.error;S.body=S.body.filter(x=>String(x.id)!==String(id));closeS();render();toast('삭제했어요')}

function cycList(){const s=[...S.cycle].sort().reverse().slice(0,6),c=cyc();if(!c)return'';const FL={spotting:'점출혈',light:'적음',medium:'보통',heavy:'많음'},t=baseDay(),ov=[addDays(c.next,-14),addDays(c.next,c.avg-14)].find(x=>x>=t);
return`<div class="mut" style="margin-top:10px">다음 배란 예상일 ${ov?md(ov):'-'} (추정)</div><div style="margin-top:8px">`+s.map(st=>{const i=(S.cinfo||{})[st]||{};return`<div class="row tap" role="button" tabindex="0" data-a="cedit" data-s="${st}"><span class="n">${md(st)}${i.e?' ~ '+md(i.e):''}<small>출혈량 ${FL[i.flow]||'-'}, 통증 ${i.pain==null?'-':i.pain+'/10'}, 진통제 ${i.pk?'복용':'안 먹음'}</small></span></div>`}).join('')+'</div><p class="mut" style="margin:8px 0 0;font-size:12px">기록을 누르면 수정할 수 있어요. 배란기와 가임기는 평균 주기로 계산한 추정이에요. 피임이나 진단 용도로 쓰면 안 돼요.</p>'}
function cycEdit(st){const i=(S.cinfo||{})[st]||{},id=(S.cid||{})[st];if(!id)return;const FM={spotting:'점출혈',light:'적음',medium:'보통',heavy:'많음'};
$('#sp').innerHTML=`<h2>생리주기 기록 수정</h2><label>시작일<input id="f_d" type="date" value="${st}"></label><label>종료일 (선택)<input id="f_de" type="date" value="${i.e||''}"></label><label>출혈량</label>${chips('cf',['점출혈','적음','보통','많음'],i.flow?[FM[i.flow]]:[])}<label>통증 정도 <b id="pv2">${i.pain||0}</b> / 10<input id="f_pn" type="range" min="0" max="10" value="${i.pain||0}" style="padding:0"></label><label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input id="f_pk" type="checkbox" style="width:auto;margin:0" ${i.pk?'checked':''}>진통제를 먹었어요</label><button class="save" data-a="ucyc" data-i="${id}" data-s="${st}">저장</button><button class="save" data-a="dcyc" data-i="${id}" data-s="${st}" style="background:none;color:var(--fat);margin-top:0">삭제</button>`;$('#sh').hidden=false}
async function ucyc(id,old){if(!fv('d'))return toast('시작일을 선택해 주세요');const fm={'점출혈':'spotting','적음':'light','보통':'medium','많음':'heavy'},
o={start_date:fv('d'),end_date:fv('de')||null,flow:fm[gv('cf')[0]]||null,pain:+$('#f_pn').value||0,painkiller:$('#f_pk').checked},r=await sb.from('cycle_logs').update(o).eq('id',id);if(r.error)throw r.error;
S.cycle=S.cycle.filter(x=>x!==old);S.cycle.push(o.start_date);delete S.cend[old];delete S.cinfo[old];delete S.cid[old];if(o.end_date)S.cend[o.start_date]=o.end_date;
S.cinfo[o.start_date]={flow:o.flow,pain:o.pain,pk:o.painkiller,e:o.end_date};S.cid[o.start_date]=id;closeS();render();toast('저장했어요')}
async function dcyc(id,old){const r=await sb.from('cycle_logs').delete().eq('id',id);if(r.error)throw r.error;S.cycle=S.cycle.filter(x=>x!==old);delete S.cend[old];delete S.cinfo[old];delete S.cid[old];closeS();render();toast('삭제했어요')}
async function checkLink(){const r=await sb.from('trainer_links').select('trainer_id').eq('member_id',me.id).eq('status','active');let skip=false;try{skip=!!sessionStorage.getItem('skipLink')}catch(e){}if(!(r.data||[]).length&&!skip)linkSheet()}



</script></body></html>
