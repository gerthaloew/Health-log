for(let i=0;i<first;i++)g+='<div class="cd off"></div>';
for(let d=1;d<=dim;d++){const k=cM+'-'+pad(d),a=CL.filter(l=>l.d===k);g+=`<button class="cd ${k===today?'td':''} ${k===cSel?'sel':''}" data-a="cdsel" data-d="${k}"><b>${d}</b>${a.length?`<i>${a.length}건</i>`:''}${a.slice(0,2).map(l=>`<span class="pl">${l.h}시 ${esc(l.name)}</span>`).join('')}${a.length>2?`<span class="pl">+${a.length-2}건</span>`:''}</button>`}
const sel=CL.filter(l=>l.d===cSel).sort((x,z)=>x.h*60+x.m-(z.h*60+z.m));
return`<div class="cnav"><button data-a="cmprev" aria-label="이전 달">‹</button><b>${y}년 ${m}월</b><button data-a="cmnext" aria-label="다음 달">›</button></div><div class="mcal">${g}</div><h3 style="margin:16px 0 0;display:flex;justify-content:space-between;align-items:center">${md(cSel)} 수업 ${sel.length}건<button class="cp" data-a="cnew">+ 수업 등록</button></h3>${sel.map(l=>`<div class="lrow"><span><b>${pad(l.h)}:${pad(l.m)}</b> ${esc(l.name)}<small class="mut"> · ${esc(l.kind||'PT')}${l.no?' '+l.no+'회차':''} · ${l.by}</small></span><button class="cp" data-a="vm" data-i="${l.mid}">기록 보기</button></div>`).join('')||'<p class="empty">이 날은 수업이 없어요.</p>'}`}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b||viewAs)return;const a=b.dataset.a;
if(a==='dview'){dView=b.dataset.v;if(dView==='cal'){cM=cM||baseDay().slice(0,7);renderDash();try{await loadCal()}catch(x){CL=[]}}renderDash()}
if(a==='cmprev'||a==='cmnext'){cM=mAdd(cM,a==='cmnext'?1:-1);cSel=cM+'-01';try{await loadCal()}catch(x){CL=[]}renderDash()}
if(a==='cdsel'){cSel=b.dataset.d;renderDash()}
if(a==='drefresh'&&dView==='cal'){try{await loadCal()}catch(x){}renderDash()}});
checkLink=async function(){const r=await sb.from('trainer_links').select('trainer_id').eq('member_id',me.id).eq('status','active');me.linked=!!(r.data||[]).length;let skip=false;try{skip=!!sessionStorage.getItem('skipLink')}catch(e){}if(!me.linked&&!skip)linkSheet()};
const _acct2=acctSheet;acctSheet=function(){_acct2();if(!me||me.p.role!=='member')return;
const fix=()=>{const sp=$('#sp');if(!sp||!me.linked)return;const c=sp.querySelector('#f_sc');if(c&&c.closest('label'))c.closest('label').remove();const lb=sp.querySelector('[data-a=linksheet]');if(lb){const d=document.createElement('div');d.className='row';d.style.marginTop='12px';d.innerHTML='<span>담당 트레이너</span><b>연결됨 ✓</b>';lb.replaceWith(d)}};
if(me.linked===true)return fix();
sb.from('trainer_links').select('trainer_id').eq('member_id',me.id).eq('status','active').then(r=>{me.linked=!!(r.data||[]).length;fix()})};

/* ===== PT 횟수, 한줄평, 캘린더에서 수업 등록 ===== */
var PTM={},OTM={},rFil='target';
const OTMAX=2;
function dLeft(e){return Math.round((Date.parse(e+'T00:00:00Z')-Date.parse(baseDay()+'T00:00:00Z'))/864e5)}
function ptLeft(x){return x&&x.total!=null?Math.max(x.total-x.used,0):null}
function regInfo(id){const x=PTM[id]||{},left=ptLeft(x),dl=x.end?dLeft(x.end):null,ym=baseDay().slice(0,7),ot=OTM[id]||0;
return{x,left,dl,ot,exp:!!x.end&&x.end.slice(0,7)===ym&&dl>=0,ended:dl!=null&&dl<0,low:left!=null&&left<5,none:x.total==null&&!x.end}}
function memTxt(dl,end){return dl==null?'':dl<0?'만료됨 ('+md(end)+')':dl===0?'오늘 만료':'D-'+dl+' ('+md(end)+')'}
function ptRow(id){const r=regInfo(id);if(r.none&&!r.ot)return'';return(r.x.end?`<div class="ml"><span>회원권</span><b class="${r.ended||r.exp?'no':''}">${memTxt(r.dl,r.x.end)}</b></div>`:'')+(r.left!=null?`<div class="ml"><span>PT 남은 횟수</span><b class="${r.low?'no':''}">${r.left} / ${r.x.total}회</b></div>`:'')+`<div class="ml"><span>이번 달 OT</span><b>${r.ot} / ${OTMAX}회</b></div>`}
async function loadPT(){PTM={};OTM={};try{const p=await sb.from('pt_packages').select('member_id,total,mem_start,mem_end');(Array.isArray(p.data)?p.data:[]).forEach(r=>PTM[r.member_id]={total:r.total,start:r.mem_start,end:r.mem_end,used:0});
const u=await qAll(()=>sb.from('lessons').select('member_id,kind,status,start_at').eq('kind','PT').lt('start_at',new Date().toISOString()).order('start_at').order('id'));
(u.data||[]).forEach(r=>{if(r.status==='cancelled'||!PTM[r.member_id])return;PTM[r.member_id].used++});
const ym=baseDay().slice(0,7),o=await qAll(()=>sb.from('lessons').select('member_id,status,start_at').eq('kind','OT').gte('start_at',ym+'-01T00:00:00+09:00').lt('start_at',mAdd(ym,1)+'-01T00:00:00+09:00').order('start_at').order('id'));
(o.data||[]).forEach(r=>{if(r.status!=='cancelled')OTM[r.member_id]=(OTM[r.member_id]||0)+1})}catch(e){}}
const _ld2=loadDash;loadDash=async function(){await _ld2();await loadPT()};
document.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
if(a==='ptset'&&viewAs){const p=S.pt||{};$('#sp').innerHTML=`<h2>${esc(viewAs.name)}님 회원권 · PT</h2><label>회원권 시작일<input id="f_ms" type="date" value="${p.mem_start||''}"></label><label>회원권 종료일<input id="f_me" type="date" value="${p.mem_end||''}"></label><label>PT 총 등록 횟수<input id="f_pt" inputmode="numeric" value="${p.total!=null?p.total:''}" placeholder="예: 20 (없으면 비워두세요)"></label><p class="mut">PT를 재등록하면 지금까지 등록한 횟수를 모두 합쳐서 입력해 주세요. 진행한 횟수는 지난 PT 일정에서 자동으로 세요.</p><button class="save" data-a="ptsave">저장</button>`;$('#sh').hidden=false}
if(a==='ptsave'&&viewAs){if(busy)return;const tv=fv('pt'),t=tv===''?null:parseInt(tv);if(t!=null&&(isNaN(t)||t<0))return toast('횟수를 숫자로 입력해 주세요');if(fv('ms')&&fv('me')&&fv('me')<fv('ms'))return toast('종료일이 시작일보다 빨라요');busy=true;try{const row={member_id:viewAs.id,trainer_id:me.id,total:t,mem_start:fv('ms')||null,mem_end:fv('me')||null,updated_at:new Date().toISOString()},r=await sb.from('pt_packages').upsert(row);if(r.error)throw r.error;S.pt={total:t,mem_start:row.mem_start,mem_end:row.mem_end};closeS();render();toast('저장했어요')}catch(err){toast('저장하지 못했어요: '+(err.message||''))}finally{busy=false}}
if(a==='olset'&&viewAs){const n=(S.notes||[]).find(x=>x.kind==='oneline'&&x.note_date===day);$('#sp').innerHTML=`<h2>${md(day)} 한줄평</h2><label>${esc(viewAs.name)}님께<input id="f_ol" maxlength="80" value="${n?esc(n.body):''}" placeholder="오늘 운동 정말 좋았어요!"></label><p class="mut">회원의 오늘 탭에 바로 보여요. 비우고 저장하면 삭제돼요.</p><button class="save" data-a="olsave">저장</button>`;$('#sh').hidden=false}
if(a==='olsave'&&viewAs){if(busy)return;busy=true;try{const t=fv('ol'),n=(S.notes||[]).find(x=>x.kind==='oneline'&&x.note_date===day&&x.author_id===me.id);
if(n&&!t){const r=await sb.from('trainer_notes').delete().eq('id',n.id);if(r.error)throw r.error;S.notes=S.notes.filter(x=>x!==n)}
else if(n){const r=await sb.from('trainer_notes').update({body:t}).eq('id',n.id);if(r.error)throw r.error;n.body=t}
else if(t){const r=await sb.from('trainer_notes').insert({member_id:viewAs.id,author_id:me.id,note_date:day,body:t,kind:'oneline'}).select().single();if(r.error)throw r.error;S.notes=[r.data,...(S.notes||[])]}
closeS();render();toast('저장했어요')}catch(err){toast('저장하지 못했어요: '+(err.message||''))}finally{busy=false}}
if(a==='cnew'&&!viewAs){const ms=me.members||[];if(!ms.length)return toast('연결된 회원이 없어요');$('#sp').innerHTML=`<h2>${md(cSel)} 수업 등록</h2><label>회원<select id="f_cm">${ms.map(m=>`<option value="${m.id}">${esc(m.display_name)}</option>`).join('')}</select></label><label>시간<input id="f_ct" type="time" value="10:00"></label><label>수업 종류</label>${chips('ck',['PT','OT','요가','필라테스','기타'],['PT'])}<label>회차 (PT만, 비우면 자동)<input id="f_cn" inputmode="numeric" placeholder="자동"></label><label>메모 (선택)<input id="f_cx"></label><button class="save" data-a="csave">저장</button>`;$('#sh').hidden=false}
if(a==='csave'&&!viewAs){if(busy)return;if(!fv('ct'))return toast('시간을 입력해 주세요');busy=true;try{const kind=gv('ck')[0]||'PT',mid=fv('cm'),at=cSel+'T'+fv('ct')+':00+09:00';let no=kind==='PT'?(parseInt(fv('cn'))||null):null;
if(kind==='OT'){const ym=cSel.slice(0,7),c=await sb.from('lessons').select('id',{count:'exact',head:true}).eq('member_id',mid).eq('kind','OT').neq('status','cancelled').gte('start_at',ym+'-01T00:00:00+09:00').lt('start_at',mAdd(ym,1)+'-01T00:00:00+09:00');if((c.count||0)>=OTMAX){busy=false;return toast('이 회원은 '+ym.slice(5)+'월 OT를 이미 '+OTMAX+'회 사용했어요')}}
if(kind==='PT'&&!no){const c=await sb.from('lessons').select('id',{count:'exact',head:true}).eq('member_id',mid).eq('kind','PT').neq('status','cancelled').lt('start_at',at);no=(c.count||0)+1}
const r=await sb.from('lessons').insert({member_id:mid,trainer_id:me.id,start_at:at,kind,session_no:no,memo:fv('cx')||null,status:'scheduled'});if(r.error)throw r.error;
closeS();try{await loadCal();await loadPT()}catch(x){}renderDash();toast('수업을 등록했어요')}catch(err){toast('등록하지 못했어요: '+(err.message||''))}finally{busy=false}}
});

function regTargets(){return(me.members||[]).map(m=>({m,r:regInfo(m.id)}))}
function regN(){return regTargets().filter(t=>t.r.exp||t.r.ended||t.r.low).length}
function regHTML(){const all=regTargets(),ym=baseDay().slice(0,7),F={target:['등록 대상',t=>t.r.exp||t.r.ended||t.r.low],exp:[ym.slice(5)+'월 만료',t=>t.r.exp],low:['PT 5회 미만',t=>t.r.low],ended:['만료됨',t=>t.r.ended],none:['미등록',t=>t.r.none],all:['전체',()=>true]};
const rows=all.filter(F[rFil][1]).sort((a,b)=>(a.r.dl==null?9999:a.r.dl)-(b.r.dl==null?9999:b.r.dl));
const tiles=`<div class="tiles"><div class="tile${all.filter(F.exp[1]).length?' warn':''}"><span>${ym.slice(5)}월 만료</span><b>${all.filter(F.exp[1]).length}<small>명</small></b></div><div class="tile${all.filter(F.low[1]).length?' warn':''}"><span>PT 5회 미만</span><b>${all.filter(F.low[1]).length}<small>명</small></b></div><div class="tile"><span>만료됨</span><b>${all.filter(F.ended[1]).length}<small>명</small></b></div><div class="tile"><span>OT 사용 (이번 달)</span><b>${all.reduce((n,t)=>n+t.r.ot,0)}<small>회</small></b></div></div>`;
const fl=`<div class="chips" style="margin-bottom:8px">${Object.keys(F).map(k=>`<button type="button" class="chip${rFil===k?' on':''}" data-a="rfil" data-v="${k}">${F[k][0]}</button>`).join('')}</div>`;
return tiles+fl+(rows.map(t=>{const r=t.r;return`<button class="mc${r.exp||r.ended||r.low?' att':''}" data-a="vm" data-i="${t.m.id}" data-n="${esc(t.m.display_name)}" style="margin-bottom:8px"><div class="mh"><b>${esc(t.m.display_name)}</b><span class="tg">${r.ended?'만료됨':r.exp?'이번 달 만료':r.low?'재등록 검토':r.none?'미등록':''}</span></div><div class="ml"><span>회원권</span><b class="${r.ended||r.exp?'no':''}">${r.x.end?memTxt(r.dl,r.x.end):'미입력'}</b></div><div class="ml"><span>PT 남은 횟수</span><b class="${r.low?'no':''}">${r.left!=null?r.left+' / '+r.x.total+'회':'미입력'}</b></div><div class="ml"><span>이번 달 OT</span><b>${r.ot} / ${OTMAX}회</b></div></button>`}).join('')||'<p class="empty">해당하는 회원이 없어요.</p>')}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b||viewAs)return;const a=b.dataset.a;
if(a==='rfil'){rFil=b.dataset.v;renderDash()}
if(a==='dview'&&b.dataset.v==='reg'){await loadPT();renderDash()}});

</script></body></html>
